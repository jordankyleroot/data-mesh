version: "3.9"

# Local development stack — Data Mesh platform
# Uses Redpanda (Kafka-compatible, no JVM, reliable on Windows Docker Desktop)
# Redpanda provides both the Kafka broker AND Schema Registry in one container.

services:

  # ── Redpanda (Kafka + Schema Registry in one, no JVM) ────────────────────
  # Two listeners:
  #   INTERNAL://redpanda:29092  — used by other containers (portal-api etc.)
  #   EXTERNAL://localhost:9092  — used by host-side scripts (producer, consumer)
  # Schema Registry: http://localhost:8081 (host) / http://redpanda:8081 (containers)
  redpanda:
    image: redpandadata/redpanda:v23.3.21
    container_name: datamesh-kafka
    hostname: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "9092:9092"    # Kafka — host scripts
      - "29092:29092"  # Kafka — internal (containers)
      - "8081:8081"    # Schema Registry
      - "8082:8082"    # HTTP Proxy
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Redpanda Console (optional UI for browsing topics/messages) ───────────
  redpanda-console:
    image: redpandadata/console:v2.4.5
    container_name: datamesh-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    restart: on-failure

  # ── Topic provisioner ─────────────────────────────────────────────────────
  kafka-setup:
    image: redpandadata/redpanda:v23.3.21
    container_name: datamesh-kafka-setup
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create orders.order-placed.critical \
          --brokers redpanda:29092 --partitions 6 --replicas 1 \
          --topic-config retention.ms=604800000 &&
        rpk topic create inventory.stock-update.standard \
          --brokers redpanda:29092 --partitions 3 --replicas 1 &&
        rpk topic create promotions.promotion-applied.standard \
          --brokers redpanda:29092 --partitions 3 --replicas 1 &&
        rpk topic create _datamesh.audit.bulk \
          --brokers redpanda:29092 --partitions 1 --replicas 1 \
          --topic-config retention.ms=2592000000 &&
        echo "All topics provisioned."
    restart: "no"

  # ── ClickHouse ────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: datamesh-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: datamesh
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: datamesh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: datamesh
      POSTGRES_USER: datamesh
      POSTGRES_PASSWORD: datamesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../platform/portal/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "datamesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── OPA ───────────────────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.64.1
    container_name: datamesh-opa
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --log-level=info
      - /policies
    volumes:
      - ../../platform/policy/rules:/policies:ro
    # OPA 0.64.1 is a distroless binary — no wget/curl available for healthcheck.
    # portal-api has its own retry logic for OPA unavailability.

  # ── Portal API ────────────────────────────────────────────────────────────
  portal-api:
    build:
      context: ../../platform/portal
      dockerfile: Dockerfile
    container_name: datamesh-portal-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://datamesh:datamesh@postgres:5432/datamesh
      KAFKA_BROKERS: redpanda:29092       # internal listener
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      OPA_URL: http://opa:8181
      JWT_SECRET: dev-secret-change-in-prod
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      opa:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: datamesh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: datamesh-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../platform/observability/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus

  # ── Kyle Corp: topic provisioner ─────────────────────────────────────────
  kyle-corp-setup:
    image: redpandadata/redpanda:v23.3.21
    container_name: kylecorp-setup
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create crude.barrel-received.critical --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create crude.batch-processed.critical --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create pipeline.flow-updated.standard --brokers redpanda:29092 --partitions 3 --replicas 1 &&
        rpk topic create pipeline.leak-alert.critical   --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create trading.deal-executed.critical --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create trading.price-tick.bulk        --brokers redpanda:29092 --partitions 1 --replicas 1 &&
        rpk topic create logistics.shipment-dispatched.standard --brokers redpanda:29092 --partitions 3 --replicas 1 &&
        rpk topic create logistics.delivery-confirmed.critical  --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create safety.incident-reported.critical      --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        rpk topic create finance.invoice-raised.standard        --brokers redpanda:29092 --partitions 3 --replicas 1 &&
        rpk topic create customer.order-placed.critical         --brokers redpanda:29092 --partitions 6 --replicas 1 &&
        echo "All Kyle Corp topics provisioned."
    restart: "no"

  # ── Kyle Corp: real-time API (port 4000) ──────────────────────────────────
  kyle-corp-api:
    build:
      context: ../../kyle-corp/api
      dockerfile: Dockerfile
    container_name: kylecorp-api
    ports:
      - "4000:4000"
    environment:
      KAFKA_BROKERS: redpanda:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: datamesh
      PORT: "4000"
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kyle Corp: customer & operations portal (port 5000) ───────────────────
  kyle-corp-frontend:
    build:
      context: ../../kyle-corp/frontend
      dockerfile: Dockerfile
    container_name: kylecorp-frontend
    ports:
      - "5000:80"
    depends_on:
      kyle-corp-api:
        condition: service_healthy
    restart: on-failure

volumes:
  kafka_data:
  clickhouse_data:
  postgres_data:
  prometheus_data:
  grafana_data:
