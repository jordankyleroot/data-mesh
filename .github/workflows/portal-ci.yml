name: Portal API CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "platform/portal/**"
  pull_request:
    paths:
      - "platform/portal/**"

jobs:
  test:
    name: Lint & Test Portal API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datamesh_test
          POSTGRES_USER: datamesh
          POSTGRES_PASSWORD: datamesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json

      - name: Install dependencies
        working-directory: platform/portal
        run: npm ci

      - name: Run migrations
        working-directory: platform/portal
        env:
          DATABASE_URL: postgres://datamesh:datamesh@localhost:5432/datamesh_test
        run: |
          npx psql $DATABASE_URL -f migrations/001_initial.sql || \
          psql $DATABASE_URL -f migrations/001_initial.sql

      - name: Lint
        working-directory: platform/portal
        run: npm run lint

      - name: Test
        working-directory: platform/portal
        env:
          DATABASE_URL: postgres://datamesh:datamesh@localhost:5432/datamesh_test
          JWT_SECRET: ci-test-secret
          OPA_URL: http://localhost:8181
          SCHEMA_REGISTRY_URL: http://localhost:8081
          KAFKA_BROKERS: localhost:9092
        run: npm test -- --coverage --forceExit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build portal image
        run: docker build platform/portal -t datamesh-portal:${{ github.sha }}
